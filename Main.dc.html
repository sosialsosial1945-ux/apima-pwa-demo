<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APIMA · Beranda</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./theme-v5.css">
<link rel="stylesheet" href="./ui-anggota.css">
<script src="./support.js"></script>
<script src="./apima-store.js"></script>
<script src="./interactions.js" defer></script>
<script src="./nav-v5.js" defer></script>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0B4F8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="APIMA">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<script src="./pwa.js" defer></script>
</head>
<body>
<x-dc>
<div class="screen">

  <header class="v5-app-header ag-header">
    <span class="v5-app-logo" aria-hidden="true">
      <img src="brand/apima-wordmark-light.webp" width="240" height="85" alt="" class="wm-light">
      <img src="brand/apima-wordmark-dark.webp" width="240" height="85" alt="" class="wm-dark">
    </span>
    <div class="ag-header-text">
      <h1 class="sr-only">Beranda APIMA</h1>
      <p class="v5-app-title" data-ag-name>Budi Santoso</p>
      <span class="v5-app-meta" data-ag-meta>Blok C-14 · ID 0123 · Sab, 14 Nov</span>
    </div>
    <div class="v5-app-actions">
      <button type="button" class="v5-icon-btn theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Ganti ke mode gelap">
        <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a href="MasukId.dc.html" class="v5-icon-btn" aria-label="Logout">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
    </div>
  </header>

  <main class="screen-scroll ag-main">

    <div id="ag-beranda" class="ag-main" style="padding:0" aria-live="polite"></div>

  </main>

  <nav class="v5-nav" data-v5-nav="anggota" data-active="beranda"></nav>

  <div id="sheet-aktifkan" class="sheet-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-aktifkan-title">
    <div class="sheet">
      <div class="ag-sheet-head">
        <h2 id="sheet-aktifkan-title">Aktifkan akun kembali</h2>
        <button type="button" class="v5-icon-btn" data-sheet-close aria-label="Tutup kontak pengurus">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <span class="v5-illus ag-sheet-illus"><img src="illustrations/hubungi-pengurus.webp" width="360" height="313" alt="" loading="lazy"></span>
      <p class="ag-sheet-text">Siapkan kartu anggota Anda dan temui pengurus di sekretariat APIMA pada jam pasar (16:00 – 03:00 WIB) atau hubungi satgas blok, ya.</p>
      <button type="button" class="btn btn-primary" data-sheet-close>Oke, Mengerti</button>
    </div>
  </div>

</div>
</x-dc>
<script>
(function () {
  'use strict';
  /* HAPUS SEBELUM PRODUKSI: keadaan demo lewat ?state=tutup|kuota0|memuat|nonaktif */
  var VIEWS = ['normal', 'tutup', 'kuota0', 'memuat', 'nonaktif'];
  var params = new URLSearchParams(window.location.search || '');
  var view = VIEWS.indexOf(params.get('state')) !== -1 ? params.get('state') : 'normal';

  var ICON_CHEVRON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function historyRow(h, todayShort, store) {
    var date = esc(h.date) + (h.date === todayShort ? ' (Malam ini)' : '');
    var label = esc(h.title) + (h.sub ? ' · ' + esc(h.sub) : '');
    var sub = h.type === 'tidak_lapor' ? label : '<span class="tone">' + label + '</span>';
    var right = (h.type === 'bayar' && typeof h.amount === 'number' && h.amount > 0)
      ? '<span class="ag-list-amt mono">' + store.formatRupiah(h.amount) + '</span>'
      : '<span class="ag-list-dash" aria-label="Tanpa pembayaran">–</span>';
    return '<li><div class="ag-list-main"><span class="ag-list-date">' + date + '</span><span class="ag-list-sub">' + sub + '</span></div>' + right + '</li>';
  }

  function heroCard(o) {
    return '<section class="v5-card ag-card' + (o.tone ? ' ag-card-' + o.tone : '') + '" aria-label="Status malam ini">' +
      '<div class="ag-hero-top"><span class="ag-status ' + o.statusClass + '">' + o.status + '</span>' +
        '<span class="ag-rate mono">' + o.right + '</span></div>' +
      '<div class="ag-hero-body">' +
        '<img src="illustrations/' + o.illus + '" width="360" height="' + o.illusH + '" alt="">' +
        '<div><h2 class="ag-hero-title">' + o.title + '</h2><p class="ag-hero-desc">' + o.desc + '</p></div>' +
      '</div>' +
      (o.actions ? '<div class="ag-btn-stack">' + o.actions + '</div>' : '') +
    '</section>';
  }

  /* Ubin ringkas: status retribusi / tanggal lunas + penjaga lapak */
  function tiles(m, linked) {
    var pj = window.APIMA_STORE.penjagaInfo(m);
    var penjagaName = pj.name;
    var activeTxt = pj.status;
    /* Belum ada penjaga: ubin membuka halaman isi penjaga, bukan QR Saya */
    var penjagaHref = pj.has ? 'AnggotaQrIdentitas.dc.html' : 'AnggotaPenjaga.dc.html?from=beranda';
    var penjagaAction = pj.has ? 'Buka QR identitas' : 'Tambah penjaga lapak';
    var retHead = m.lunas ? 'Lunas sampai' : 'Status retribusi';
    var lunasTxt = m.lunas ? m.paidUntilLabel : 'Belum bayar';
    var retSub = m.lunas ? 'Sudah bayar' : 'Malam ini';
    var retSubCls = m.lunas ? 'st-success' : 'st-muted';
    var lunasVal = '<span class="stack" style="gap:2px"><span class="ag-tile-value' + (m.lunas ? '' : ' is-zero') + '" id="main-paid-until">' + esc(lunasTxt) + '</span>' +
      '<span class="ag-tile-sub ' + retSubCls + '">' + retSub + '</span></span>';
    if (!linked) {
      return '<div class="ag-tiles">' +
        '<div class="v5-tile ag-tile"><span class="ag-tile-head">' + retHead + '</span>' + lunasVal + '</div>' +
        '<div class="v5-tile ag-tile"><span class="ag-tile-head">Penjaga lapak</span>' +
          '<span class="stack" style="gap:2px"><span class="ag-tile-value" id="main-penjaga-status">' + esc(penjagaName) + '</span>' +
          '<span class="ag-tile-sub ' + pj.tone + '">' + activeTxt + '</span></span></div>' +
      '</div>';
    }
    return '<div class="ag-tiles">' +
      '<a href="AnggotaPilihHari.dc.html" class="v5-tile ag-tile" aria-label="' + (m.lunas ? 'Lunas sampai ' + esc(lunasTxt) + '. Perpanjang' : 'Status retribusi belum bayar malam ini. Bayar retribusi') + '">' +
        '<span class="ag-tile-head">' + retHead + ICON_CHEVRON + '</span>' + lunasVal + '</a>' +
      '<a href="' + penjagaHref + '" class="v5-tile ag-tile" aria-label="Penjaga lapak ' + esc(penjagaName) + ', ' + activeTxt + '. ' + penjagaAction + '">' +
        '<span class="ag-tile-head">Penjaga lapak' + ICON_CHEVRON + '</span>' +
        '<span class="stack" style="gap:2px"><span class="ag-tile-value" id="main-penjaga-status">' + esc(penjagaName) + '</span>' +
        '<span class="ag-tile-sub ' + pj.tone + '">' + activeTxt + '</span></span></a>' +
    '</div>';
  }

  function historySection(m, store, todayShort) {
    var history = Array.isArray(m.history) ? m.history : [];
    var head = '<div class="ag-section-head"><h2>Riwayat retribusi</h2>' +
      '<span class="ag-total mono" id="main-history-total">Total ' + store.formatRupiah(store.getHistoryTotal(m)) + '</span></div>';
    if (!history.length) {
      return head + '<div class="v5-card ag-card ag-empty" id="main-history-empty">' +
        '<img src="illustrations/data-kosong.webp" width="360" height="332" alt="" loading="lazy">' +
        '<span class="ag-empty-title">Belum ada riwayat</span>' +
        '<p class="ag-small">Pembayaran QRIS dan laporan jualan Anda tercatat di sini setelah malam pertama.</p></div>';
    }
    return head + '<ul class="v5-list ag-list" id="main-history-list">' +
      history.slice(0, 5).map(function (h) { return historyRow(h, todayShort, store); }).join('') + '</ul>';
  }

  function render() {
    var store = window.APIMA_STORE;
    var host = document.getElementById('ag-beranda');
    if (!store || !host) return;
    var st = store.getState();
    var real = store.getActiveMember();
    var todayShort = store.formatDateInfo(st.dayOffset).short;
    var m = real;
    if (view === 'kuota0') {
      m = JSON.parse(JSON.stringify(real));
      m.paidUntil = null;
      m.lunas = false;
      m.reportedTonight = false;
      m.tonightStatus = 'belum_bayar';
    }
    var html = '';

    if (view === 'memuat') {
      html =
        '<section class="v5-card ag-card" aria-label="Memuat status malam ini" aria-busy="true">' +
          '<div class="ag-hero-body">' +
            '<img src="illustrations/memuat-data.webp" width="360" height="386" alt="">' +
            '<div><h2 class="ag-hero-title">Sedang diproses</h2><p class="ag-hero-desc" role="status">Tunggu sekejap, ya.</p></div>' +
          '</div>' +
          '<div class="stack" style="gap:10px" aria-hidden="true">' +
            '<span class="v5-skel ag-skel-line" style="width:100%"></span>' +
            '<span class="v5-skel ag-skel-line" style="width:66%"></span>' +
            '<span class="v5-skel ag-skel-block"></span>' +
          '</div>' +
        '</section>' +
        '<div class="ag-tiles" aria-hidden="true">' +
          '<div class="v5-tile ag-tile"><span class="v5-skel ag-skel-line" style="width:80px"></span><span class="v5-skel" style="height:20px;width:64px"></span></div>' +
          '<div class="v5-tile ag-tile"><span class="v5-skel ag-skel-line" style="width:96px"></span><span class="v5-skel" style="height:20px;width:80px"></span></div>' +
        '</div>';
    } else if (view === 'nonaktif') {
      html =
        '<section class="v5-card ag-card" aria-label="Status akun tidak aktif">' +
          '<div class="ag-row-between" style="padding-bottom:16px;border-bottom:1px solid var(--apima-line)"><span class="ag-muted" style="font-size:15px">Status keanggotaan</span><span class="ag-status st-danger">Tidak Aktif</span></div>' +
          '<div class="ag-hero-body">' +
            '<img src="illustrations/akun-nonaktif.webp" width="360" height="305" alt="">' +
            '<div><h2 class="ag-hero-title">Akun sedang dinonaktifkan</h2><p class="ag-hero-desc">Anda belum bisa melapor jualan untuk sementara. Hubungi pengurus APIMA untuk mengaktifkan kembali akun Anda.</p></div>' +
          '</div>' +
          '<button type="button" class="btn btn-primary" data-ag-open-aktifkan aria-haspopup="dialog">Hubungi Pengurus APIMA</button>' +
        '</section>';
    } else if (view === 'tutup') {
      html = heroCard({
        status: 'Pasar Tutup', statusClass: '', right: '16:00 – 03:00 WIB',
        illus: 'tutup-offline.webp', illusH: 324,
        title: 'Lapak dibuka pukul 16:00 WIB',
        desc: m.lunas
          ? 'Sekarang di luar jam pasar. Retribusi Anda lunas sampai <strong>' + esc(m.paidUntilLabel) + '</strong>.'
          : 'Sekarang di luar jam pasar. Bayar retribusi sebelum lapak buka supaya malam ini lunas.',
        actions: '<a href="AnggotaPilihHari.dc.html" class="btn btn-secondary">' + (m.lunas ? 'Perpanjang' : 'Bayar Retribusi') + '</a>'
      }) + tiles(m, false);
    } else {
      var hero;
      if (m.lunas && m.reportedTonight) {
        hero = heroCard({
          tone: 'lunas',
          status: 'Sedang Jualan · Sudah Bayar', statusClass: 'st-success', right: 'Rp3.000/mlm',
          illus: 'cek-satgas.webp', illusH: 304,
          title: 'Sedang jualan malam ini',
          desc: 'Retribusi Anda lunas sampai <strong>' + esc(m.paidUntilLabel) + '</strong>. Tunjukkan QR identitas saat satgas keliling.',
          actions: '<a href="AnggotaQrIdentitas.dc.html" class="btn ag-btn-tonal">Tunjukkan QR ke Satgas</a>' +
            '<a href="AnggotaPilihHari.dc.html" class="btn btn-secondary">Perpanjang</a>'
        });
      } else if (m.lunas) {
        hero = heroCard({
          tone: 'lunas',
          status: 'Lapak Belum Buka', statusClass: 'st-warning', right: 'Rp3.000/mlm',
          illus: 'pasang-hp.webp', illusH: 343,
          title: 'Lunas sampai ' + esc(m.paidUntilLabel),
          desc: 'Retribusi malam ini sudah terbayar. Klik Buka Lapak agar tercatat sedang berjualan.',
          actions: (view === 'normal'
            ? '<button type="button" id="btn-lapor-jualan" class="btn btn-primary">Buka Lapak</button>'
            : '') +
            '<a href="AnggotaPilihHari.dc.html" class="btn btn-secondary">Perpanjang</a>'
        });
      } else {
        hero = heroCard({
          tone: 'belum',
          status: 'Lapak Belum Buka', statusClass: 'st-warning', right: 'Rp3.000/mlm',
          illus: 'tutup-offline.webp', illusH: 324,
          title: 'Lapak belum dibuka',
          desc: (m.paidUntilLabel ? 'Terakhir bayar sampai ' + esc(m.paidUntilLabel) + '. ' : '') + 'Klik Buka Lapak untuk bayar retribusi lewat QRIS dan mulai berjualan, ya.',
          actions: '<a href="AnggotaPilihHari.dc.html?from=beranda" class="btn btn-primary">Buka Lapak</a>'
        });
      }
      html = hero + tiles(m, true) + historySection(m, store, todayShort);
    }

    host.innerHTML = html;

    var laporBtn = document.getElementById('btn-lapor-jualan');
    if (laporBtn) {
      laporBtn.addEventListener('click', function () {
        laporBtn.disabled = true;
        var res = store.reportSellingTonight(real.id);
        if (res && res.ok) {
          render();
          if (window.apimaToast) window.apimaToast('Lapak tercatat buka malam ini.');
        } else {
          laporBtn.disabled = false;
        }
      });
    }
    var openAktif = host.querySelector('[data-ag-open-aktifkan]');
    if (openAktif) {
      openAktif.addEventListener('click', function () {
        var sheet = document.getElementById('sheet-aktifkan');
        sheet.hidden = false;
        var c = sheet.querySelector('[data-sheet-close]');
        if (c) c.focus();
        sheet._agReturn = openAktif;
      });
    }
  }

  /* HAPUS SEBELUM PRODUKSI: simulasi keadaan Beranda lewat panel Mode uji atau ?state=... */
  function setBerandaView(next) {
    view = VIEWS.indexOf(next) !== -1 ? next : 'normal';
    try {
      var url = new URL(window.location.href);
      if (view === 'normal') url.searchParams.delete('state'); else url.searchParams.set('state', view);
      history.replaceState(null, '', url.pathname + url.search);
    } catch (e) {}
    render();
  }
  window.__apimaSetBerandaView = setBerandaView;
  window.__apimaGetBerandaView = function () { return view; };

  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    render();
    window.addEventListener('apima:state-change', render);
  }

  window.addEventListener('apima:ready', boot);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 40); });
  } else {
    setTimeout(boot, 40);
  }
})();
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
