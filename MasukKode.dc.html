<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APIMA · Masukkan kode</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./theme-v5.css">
<link rel="stylesheet" href="./ui-anggota.css">
<script src="./support.js"></script>
<script src="./interactions.js" defer></script>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0B4F8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="APIMA">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<script src="./pwa.js" defer></script>
</head>
<body>
<x-dc>
<div class="screen">

  <header class="ag-topbar">
    <a href="MasukId.dc.html" class="ag-back-link">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Kembali
    </a>
    <button type="button" class="v5-icon-btn boxed theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Ganti ke mode gelap">
      <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </header>

  <main class="screen-scroll ag-main ag-wide">

    <div class="ag-step-head">
      <span class="ag-eyebrow mono" data-otp-id-label>ID 0123</span>
      <h1 class="ag-step-title">Masukkan kode</h1>
      <p class="ag-step-desc">Kode 6 angka sudah dikirim lewat WhatsApp. Setelah kode benar, Anda langsung masuk ke halaman sesuai ID akun.</p>
    </div>

    <section class="v5-card ag-card" aria-label="Isian kode verifikasi WhatsApp">
      <span class="v5-illus ag-done-illus"><img src="illustrations/otp-wa.webp" width="360" height="336" alt=""></span>
      <div class="ag-field">
        <label for="otp" class="ag-label" style="font-size:14px">Kode 6 angka dari WhatsApp</label>
        <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" class="ag-otp">
      </div>
      <div class="ag-resend">
        <span data-resend-label>Kirim ulang dalam <strong data-resend-after="42">42 detik</strong></span>
        <span data-resend-ready hidden>Kode belum masuk?</span>
        <button type="button" disabled class="v5-link" data-resend-btn>Kirim Ulang Kode</button>
      </div>
    </section>

  </main>

  <div class="screen-footer ag-footer">
    <a href="Main.dc.html" class="btn btn-primary" data-otp-submit>Login</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
