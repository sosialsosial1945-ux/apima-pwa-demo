<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./theme-v5.css">
<link rel="stylesheet" href="./ui-satgas.css">
<script src="./support.js"></script>
<script src="./apima-store.js"></script>
<script src="./interactions.js" defer></script>
<script src="./nav-v5.js" defer></script>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0B4F8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="APIMA">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<script src="./pwa.js" defer></script>
</head>
<body>
<x-dc>
<div class="screen">

  <header class="v5-app-header sg-header home">
    <span class="v5-app-logo sg-logo" aria-hidden="true">
      <span class="brand-wordmark">
        <img src="brand/apima-wordmark-light.webp" width="51" height="18" alt="" class="wm-light">
        <img src="brand/apima-wordmark-dark.webp" width="50" height="18" alt="" class="wm-dark">
      </span>
    </span>
    <div class="sg-header-text">
      <p class="v5-app-title">APIMA · Satgas</p>
      <span class="v5-app-meta"><span id="sg-date">Sab, 14 Nov</span> · S-01 Ahmad Fauzi</span>
    </div>
    <div class="v5-app-actions">
      <button type="button" class="v5-icon-btn theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Ganti ke mode gelap">
        <svg class="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a href="MasukId.dc.html" class="v5-icon-btn" aria-label="Keluar akun petugas" title="Keluar ke halaman masuk">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
    </div>
  </header>

  <main class="screen-scroll" style="display:flex;flex-direction:column">
    <section class="sg-top" aria-labelledby="sg-title">
      <div class="sg-title-row">
        <h1 id="sg-title" class="sg-page-title">Cek lapak malam ini</h1>
        <a id="sg-send-link" href="SatgasTemuan.dc.html" class="sg-warn-link" hidden>Kirim 1 temuan</a>
      </div>
      <div class="sg-metrics" aria-label="Ringkasan status malam ini">
        <div class="sg-metric">
          <span id="sg-metric-belum" class="sg-metric-num st-danger">36</span>
          <span class="sg-metric-label">Belum bayar</span>
        </div>
        <div class="sg-metric">
          <span id="sg-metric-jualan" class="sg-metric-num">214</span>
          <span class="sg-metric-label">Jualan</span>
        </div>
        <div class="sg-metric">
          <span id="sg-metric-checked" class="sg-metric-num st-success">97</span>
          <span class="sg-metric-label">Sudah dicek</span>
        </div>
      </div>
    </section>

    <section class="sg-filters" aria-label="Pencarian dan saringan anggota">
      <div class="sg-search">
        <svg class="sg-search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.6-4.6"/></svg>
        <label for="sg-cari" class="sr-only">Cari nama, blok, atau ID anggota</label>
        <input id="sg-cari" type="search" class="v5-input" placeholder="Cari nama, blok, atau ID (0123)" autocomplete="off">
        <button id="sg-cari-clear" type="button" class="v5-icon-btn sg-search-clear" aria-label="Hapus pencarian" hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="v5-seg sg-seg" role="group" aria-label="Saring status anggota">
        <button type="button" data-filter="belum-bayar" aria-pressed="true">Belum Bayar</button>
        <button type="button" data-filter="belum-dicek" aria-pressed="false">Belum Dicek</button>
        <button type="button" data-filter="semua" aria-pressed="false">Semua</button>
      </div>
      <span id="sg-count" class="sr-only" aria-live="polite"></span>
    </section>

    <ul id="sg-list" class="sg-list" aria-label="Daftar lapak"></ul>

    <div id="sg-empty" class="sg-empty" hidden>
      <span class="v5-illus sg-illus-lg"><img src="illustrations/tidak-ditemukan.webp" width="128" height="112" alt=""></span>
      <h2 class="sg-empty-title">Tidak ada anggota yang cocok</h2>
      <p class="sg-empty-sub">Periksa ejaan nama, nomor blok, atau 4 digit ID.</p>
      <button id="sg-reset" type="button" class="btn v5-btn-outline sg-btn-auto">Tampilkan Semua</button>
    </div>
  </main>

  <nav class="v5-nav" data-v5-nav="satgas" data-active="daftar"></nav>
</div>
</x-dc>
<script>
(function () {
  var filter = 'belum-bayar';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  /* Jam pemeriksaan terakhir anggota ini dari log satgas (jika ada) */
  function checkedTime(st, m) {
    var logs = st.satgasLogs || [];
    for (var i = 0; i < logs.length; i++) {
      if (String(logs[i].anggota || '').indexOf('(' + m.id + ')') !== -1 && logs[i].jam) return logs[i].jam + ' WIB';
    }
    return '';
  }

  function render() {
    var store = window.APIMA_STORE;
    if (!store) return;
    var st = store.reload();
    var checked = Array.isArray(st.checkedMemberIds) ? st.checkedMemberIds : [];

    document.getElementById('sg-date').textContent = store.formatDateInfo(st.dayOffset).short;

    var belum = 0, sudah = 0;
    st.members.forEach(function (m) {
      if (m.tonightStatus === 'belum_bayar') belum++;
      if (m.tonightStatus === 'sudah_bayar') sudah++;
    });
    /* Angka dasar zona + data uji; pemeriksaan baru menambah "Sudah dicek" */
    document.getElementById('sg-metric-belum').textContent = String(36 + belum);
    document.getElementById('sg-metric-jualan').textContent = String(211 + sudah);
    document.getElementById('sg-metric-checked').textContent = String(96 + checked.length);

    var pending = store.countPendingSatgasFindings ? store.countPendingSatgasFindings() : 0;
    var link = document.getElementById('sg-send-link');
    link.hidden = pending === 0;
    link.textContent = 'Kirim ' + pending + ' temuan';

    var q = document.getElementById('sg-cari').value.trim().toLowerCase();
    var rows = st.members.filter(function (m) {
      var isChecked = checked.indexOf(m.id) !== -1;
      if (filter === 'belum-bayar' && m.tonightStatus === 'sudah_bayar') return false;
      if (filter === 'belum-dicek' && isChecked) return false;
      if (!q) return true;
      return (m.name + ' ' + m.id + ' ' + m.blok + ' ' + m.blok.replace('Blok ', '')).toLowerCase().indexOf(q) !== -1;
    });

    document.getElementById('sg-list').innerHTML = rows.map(function (m) {
      var isChecked = checked.indexOf(m.id) !== -1;
      var statusText = 'Belum Bayar', statusCls = 'st-danger';
      if (m.tonightStatus === 'belum_lapor') { statusText = 'Belum Lapor'; statusCls = 'st-warning'; }
      else if (m.tonightStatus === 'sudah_bayar') { statusText = isChecked ? 'Terverifikasi' : 'Sudah Bayar'; statusCls = 'st-success'; }
      var note = m.note || '';
      if (isChecked) {
        var t = checkedTime(st, m);
        note = t ? ('Dicek ' + t) : (/^Dicek/.test(note) ? note : 'Sudah dicek');
      }
      var checkIcon = isChecked
        ? '<svg class="sg-row-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>'
        : '';
      var label = m.name + ', ID ' + m.id + ', ' + m.blok + ', ' + statusText + (isChecked ? ', sudah dicek' : '');
      return '<li data-member-id="' + esc(m.id) + '" data-checked="' + (isChecked ? 'true' : 'false') + '">' +
        '<a class="sg-row" href="SatgasScan.dc.html?id=' + encodeURIComponent(m.id) + '" aria-label="' + esc(label) + '">' +
          '<span class="sg-row-main">' +
            '<span class="sg-row-name">' + esc(m.name) + '</span>' +
            '<span class="sg-row-sub"><span class="mono">ID ' + esc(m.id) + '</span> · ' + esc(m.blok) + (note ? ' · ' + esc(note) : '') + '</span>' +
          '</span>' +
          '<span class="sg-row-status ' + statusCls + '">' + checkIcon + esc(statusText) + '</span>' +
        '</a></li>';
    }).join('');

    document.getElementById('sg-empty').hidden = rows.length > 0;
    document.getElementById('sg-count').textContent = rows.length + ' anggota ditampilkan';
    document.getElementById('sg-cari-clear').hidden = !q;
  }

  function setFilter(next) {
    filter = next;
    document.querySelectorAll('[data-filter]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.filter === next ? 'true' : 'false');
    });
    render();
  }

  function init() {
    var input = document.getElementById('sg-cari');
    input.addEventListener('input', render);
    document.getElementById('sg-cari-clear').addEventListener('click', function () {
      input.value = '';
      render();
      input.focus();
    });
    document.querySelectorAll('[data-filter]').forEach(function (b) {
      b.addEventListener('click', function () { setFilter(b.dataset.filter); });
    });
    document.getElementById('sg-reset').addEventListener('click', function () {
      input.value = '';
      setFilter('semua');
      input.focus();
    });
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  window.addEventListener('apima:state-change', render);
})();
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</script>
</body>
</html>
