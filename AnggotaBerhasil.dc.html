<!doctype html>
<html lang="id">
<head>

<link rel="stylesheet" href="./styles.css">

<body>
<x-dc>
<div class="screen">

  <header class="header-compact between">
    <span class="brand-wordmark">
      <img src="brand/apima-wordmark-light.webp" width="79" height="28" alt="APIMA" class="wm-light">
      <img src="brand/apima-wordmark-dark.webp" width="79" height="28" alt="" aria-hidden="true" class="wm-dark">
    </span>
    <span class="text-sm text-secondary tnum">Sab, 14 Nov</span>
  </header>

  <main class="screen-scroll stack gap-3" style="padding:16px">

    <section class="hero-card tone-success items-center text-center" aria-label="Status pembayaran berhasil">
      <img src="illustrations/bayar-sukses.webp" alt="Ilustrasi pembayaran retribusi berhasil" class="illus-hero">
      <div class="stack gap-1 items-center">
        <h1 class="text-lg m-0">Pembayaran berhasil!</h1>
        <p class="text-sm text-secondary m-0">Retribusi Anda sudah masuk dan status jualan malam ini langsung aktif.</p>
      </div>
      <span class="pill pill-success" style="align-self:center">
        <span class="status-dot dot-success" aria-hidden="true"></span>
        Jualan · Sudah Bayar
      </span>
    </section>

    <section class="open-section" aria-label="Rincian transaksi">
      <span class="text-bold">Rincian transaksi</span>
      <ul class="open-list">
        <li class="open-row">
          <span class="text-sm text-secondary">Malam ini</span>
          <span class="text-sm fw-700">Sab, 14 Nov 2026</span>
        </li>
        <li class="open-row">
          <span class="text-sm text-secondary">Dibayar</span>
          <span class="text-sm fw-700 tnum">Rp21.000 · 7 malam</span>
        </li>
        <li class="open-row">
          <span class="text-sm text-secondary">Sisa retribusi</span>
          <span class="text-md fw-700 text-success tnum">14 malam</span>
        </li>
      </ul>
    </section>

  </main>

  <div class="screen-footer">
    <a href="Main.dc.html" class="btn btn-primary no-underline">Kembali ke Beranda</a>
    <a href="AnggotaQrIdentitas.dc.html" class="btn btn-secondary no-underline">Lihat QR Saya</a>
  </div>

</div>
</x-dc>
