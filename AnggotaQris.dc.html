<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APIMA · Bayar QRIS</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./theme-v5.css">
<link rel="stylesheet" href="./ui-anggota.css">
<script src="./support.js"></script>
<script src="./apima-store.js"></script>
<script src="./lib/qrcode.js"></script>
<script src="./interactions.js" defer></script>
<script src="./nav-v5.js" defer></script>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0B4F8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="APIMA">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<script src="./pwa.js" defer></script>
</head>
<body>
<x-dc>
<div class="screen">

  <header class="v5-app-header ag-header ag-subheader">
    <a href="AnggotaPilihHari.dc.html" class="v5-icon-btn ag-back" aria-label="Kembali ke pilih jumlah malam">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1 class="ag-sub-title">Bayar QRIS</h1>
    <span class="ag-timer" role="timer" aria-label="Sisa waktu bayar QRIS">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="mono" data-countdown="892">14:52</span>
    </span>
  </header>

  <main class="screen-scroll ag-main">

    <section class="v5-card ag-card" aria-label="QR pembayaran QRIS">
      <div class="ag-pay-head">
        <img src="illustrations/bayar-sukses.webp" width="360" height="255" alt="">
        <div class="stack" style="gap:2px;min-width:0">
          <span class="ag-muted" style="font-size:15px">Total bayar</span>
          <span class="ag-pay-amt" id="qris-amount">Rp3.000</span>
          <span class="ag-muted" style="font-size:14px" id="qris-breakdown">1 malam × Rp3.000 · Batas 03:00 WIB</span>
        </div>
      </div>

      <div class="ag-qr-box">
        <span class="ag-qr-box-title">APIMA · Retribusi Pasar</span>
        <span class="ag-qr-tile" id="qris-svg-host">
          <svg id="qris-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 212" width="176" height="176" role="img" aria-label="Kode QRIS untuk pembayaran"><rect width="212" height="212" fill="#FFFFFF"/></svg>
        </span>
        <span class="ag-muted" style="font-size:14px">Scan lewat dompet digital atau m-banking</span>
      </div>

      <div class="ag-btn-stack">
        <button type="button" id="btn-confirm-pay" class="btn btn-primary">Konfirmasi Sudah Bayar</button>
        <button type="button" class="btn btn-secondary" data-save-qr>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Simpan QR
        </button>
      </div>

      <!-- HAPUS SEBELUM PRODUKSI: simulasi keadaan gagal untuk demo -->
      <div class="ag-demo-row" aria-label="Simulasi demo">
        <a href="AnggotaGagal.dc.html" class="ag-demo-btn" id="sim-expired">Simulasi QR Kedaluwarsa</a>
        <a href="AnggotaGangguan.dc.html" class="ag-demo-btn" id="sim-gangguan">Simulasi Gangguan Sistem</a>
      </div>
      <!-- /HAPUS SEBELUM PRODUKSI -->
    </section>

  </main>

  <nav class="v5-nav" data-v5-nav="anggota" data-active="bayar"></nav>

</div>
</x-dc>
<script>
(function () {
  'use strict';
  function renderQrisSvg(payload, priceStr) {
    var host = document.getElementById('qris-svg-host');
    if (!host || typeof window.qrcode !== 'function') return;
    try {
      var qr = window.qrcode(0, 'M');
      qr.addData(payload);
      qr.make();
      var count = qr.getModuleCount();
      var pad = 2;
      var total = count + pad * 2;
      var rects = ['<rect width="' + total + '" height="' + total + '" fill="#FFFFFF"/>'];
      for (var r = 0; r < count; r++) {
        for (var c = 0; c < count; c++) {
          if (qr.isDark(r, c)) {
            rects.push('<rect x="' + (c + pad) + '" y="' + (r + pad) + '" width="1" height="1" fill="#0F172A"/>');
          }
        }
      }
      host.innerHTML =
        '<svg id="qris-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + ' ' + total + '" width="176" height="176" shape-rendering="crispEdges" role="img" aria-label="Kode QRIS untuk pembayaran ' + priceStr + '">' +
        rects.join('') +
        '</svg>';
    } catch (e) {}
  }

  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    var store = window.APIMA_STORE;
    var params = new URLSearchParams(window.location.search || '');
    var qNights = parseInt(params.get('nights'), 10);
    var pending = store ? store.getPendingOrder() : { nights: 1 };
    var nights = (!isNaN(qNights) && qNights >= 1 && qNights <= 30) ? qNights : (pending.nights || 1);
    if (store) store.setPendingOrder(nights, pending.fromBeranda);

    var amount = nights * 3000;
    var priceStr = store ? store.formatRupiah(amount) : ('Rp' + amount.toLocaleString('id-ID'));

    document.getElementById('qris-amount').textContent = priceStr;
    document.getElementById('qris-breakdown').textContent = nights + ' malam × Rp3.000 · Batas 03:00 WIB';
    document.getElementById('sim-expired').setAttribute('href', 'AnggotaGagal.dc.html?nights=' + nights);
    document.getElementById('sim-gangguan').setAttribute('href', 'AnggotaGangguan.dc.html?nights=' + nights);

    var member = store ? store.getActiveMember() : { id: '0123' };
    var payload = '00020101021226380014ID.APIMA.QRIS0204' + member.id + '5406' + String(amount) + '5802ID5905APIMA6304' + String(nights).padStart(2, '0');
    renderQrisSvg(payload, priceStr);

    var payBtn = document.getElementById('btn-confirm-pay');
    payBtn.addEventListener('click', function () {
      payBtn.disabled = true;
      if (store) store.confirmPayment(nights);
      window.location.href = 'AnggotaBerhasil.dc.html?nights=' + nights;
    });
  }

  window.addEventListener('apima:ready', boot);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 40); });
  } else {
    setTimeout(boot, 40);
  }
})();
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
